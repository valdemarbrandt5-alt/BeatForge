name: Restore BeatForge page
on:
  push:
    paths:
      - '.github/workflows/restore-page.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore page.tsx from last good commit
        run: |
          git checkout 1f62ccd5d3caa0312a9f5540a06dd37230be9488 -- beatforge-web-v10.2/src/app/page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore page.tsx after accidental truncation"
          git push
